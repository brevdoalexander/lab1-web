<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная №1</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <h1>Проверка попадания точки</h1>
    <p>Бревдо Александр, P3212, Вариант 12686</p>
</header>
<main>
    <form>
        <fieldset>
            <legend>Координата X</legend>
            <button type="button" data-x="-4">-4</button>
            <button type="button" data-x="-3">-3</button>
            <button type="button" data-x="-2">-2</button>
            <button type="button" data-x="-1">-1</button>
            <button type="button" data-x="0">0</button>
            <button type="button" data-x="1">1</button>
            <button type="button" data-x="2">2</button>
            <button type="button" data-x="3">3</button>
            <button type="button" data-x="4">4</button>
        </fieldset>
        <fieldset>
            <legend>Радиус R</legend>
            <button type="button" data-r="1">1</button>
            <button type="button" data-r="2">2</button>
            <button type="button" data-r="3">3</button>
            <button type="button" data-r="4">4</button>
            <button type="button" data-r="5">5</button>
        </fieldset>
        <label for="y">Координата Y</label>
        <input type="text" id="y" name="y" required>
        <button type="submit">Проверить</button>
    </form>
</main>
</body>
</html>
